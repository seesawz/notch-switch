# 本地签名配置（被 setup-signing.sh / build-app.sh / run-app.sh 共同引用）
#
# 这是一个**仅用于本机开发的独立钥匙串**，口令硬编码且无实际保密价值
# （它的作用只是让 codesign 不需要交互式输入密码）。
# 撤销：./scripts/setup-signing.sh --uninstall

SIGN_IDENTITY="NotchSwitch Local Signing"
SIGN_KEYCHAIN_NAME="notchswitch-signing.keychain-db"
SIGN_KEYCHAIN_PASSWORD="notchswitch"
SIGN_KEYCHAIN_PATH="$HOME/Library/Keychains/$SIGN_KEYCHAIN_NAME"
